<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบหลังบ้าน - IT รพ.กุดรัง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>

  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #e2e8f0; }
    .CodeMirror { text-align: left !important; font-family: 'Consolas', monospace; font-size: 14px; height: 350px !important; border-radius: 0.5rem; }
  </style>
</head>
<body class="p-2 md:p-6">

  <!-- หน้าล็อกอิน -->
  <div id="loginSection" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 mt-10 text-center border border-teal-100">
    <div class="inline-block p-4 bg-teal-50 text-teal-600 rounded-full mb-4 shadow-inner">
      <i class="fa-solid fa-shield-halved text-4xl"></i>
    </div>
    <h2 class="text-2xl font-semibold text-gray-800 mb-2">เจ้าหน้าที่ IT</h2>
    <p class="text-gray-500 text-sm mb-6">กรุณาใส่รหัสผ่านเพื่อเข้าสู่ระบบหลังบ้าน</p>
    <input type="password" id="pinInput" class="w-full text-center text-3xl tracking-widest rounded-xl border-gray-300 bg-gray-50 p-3 mb-5 focus:ring-2 focus:ring-teal-500" placeholder="•••••">
    <div class="flex space-x-2">
      <button onclick="goHome()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 rounded-xl transition">กลับ</button>
      <button onclick="checkPin()" class="w-2/3 bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 rounded-xl shadow-md transition">เข้าสู่ระบบ</button>
    </div>
  </div>

  <!-- หน้าแดชบอร์ด Admin -->
  <div id="dashboardSection" class="max-w-7xl mx-auto hidden mt-2">
    <div class="bg-teal-700 rounded-t-2xl p-4 md:p-5 flex flex-col md:flex-row justify-between items-center gap-3 shadow-lg">
      <h2 class="text-xl md:text-2xl font-semibold text-white flex items-center">
        <i class="fa-solid fa-laptop-code mr-3 bg-teal-800 p-2 rounded-lg"></i> จัดการคำขอข้อมูล
      </h2>
      <div class="flex space-x-2 w-full md:w-auto">
        <button onclick="goHome()" class="flex-1 md:flex-none bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg text-sm font-medium transition border border-white/20"><i class="fa-solid fa-house mr-1"></i> หน้าหลัก</button>
        <button onclick="loadData()" class="flex-1 md:flex-none bg-teal-500 hover:bg-teal-400 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md"><i class="fa-solid fa-rotate-right mr-1"></i> รีเฟรช</button>
      </div>
    </div>

    <!-- ส่วนสรุปข้อมูล (Summary Cards) -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 my-4 px-1">
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200 border-l-4 border-l-teal-500">
        <p class="text-xs text-gray-500 font-medium">คำขอทั้งหมด</p>
        <p class="text-2xl font-bold text-gray-800" id="count-total">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200 border-l-4 border-l-amber-400">
        <p class="text-xs text-gray-500 font-medium">รอดำเนินการ</p>
        <p class="text-2xl font-bold text-amber-600" id="count-pending">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200 border-l-4 border-l-blue-400">
        <p class="text-xs text-gray-500 font-medium">กำลังดำเนินการ</p>
        <p class="text-2xl font-bold text-blue-600" id="count-progress">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200 border-l-4 border-l-green-400">
        <p class="text-xs text-gray-500 font-medium">ส่งไฟล์แล้ว</p>
        <p class="text-2xl font-bold text-green-600" id="count-done">0</p>
      </div>
    </div>
    <!-- สิ้นสุด: ส่วนสรุปข้อมูล -->

    <!-- ตารางข้อมูล -->
    <div class="bg-white rounded-b-2xl shadow-xl overflow-hidden border border-gray-200">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left whitespace-nowrap">
          <thead class="text-xs text-gray-500 uppercase bg-gray-50 border-b">
            <tr>
              <th class="px-5 py-4 font-semibold">วันเวลาที่ขอ</th>
              <th class="px-5 py-4 font-semibold">ผู้ขอ (หน่วยงาน)</th>
              <th class="px-5 py-4 font-semibold">รายงานที่ต้องการ / ไฟล์แนบ</th>
              <th class="px-5 py-4 font-semibold text-center">สถานะ</th>
              <th class="px-5 py-4 font-semibold text-center bg-teal-50 text-teal-800">จัดการ</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100">
            <tr><td colspan="5" class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-teal-500 text-2xl"></i></td></tr>
          </tbody>
        </table>
      </div>
      <!-- พื้นที่ใส่ปุ่มแบ่งหน้า -->
      <div id="paginationControls"></div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------------------
    // URL API จาก Google Apps Script (อย่าแก้ไขส่วนนี้)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSUbnnq8LCCf-5rWLQsvNUqZGPEKJEtNCus5HACYQM7X0urZtXwhYyGJY-FS3wIhKK/exec";
    // -------------------------------------------------------------------------

    let requestsData = []; 
    let currentPage = 1;       // ตัวแปรเก็บหน้าปัจจุบัน
    const rowsPerPage = 8;     // กำหนดให้แสดงหน้าละ 8 รายการ

    function goHome() { window.location.href = 'index.html'; }

    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === '24704') {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        loadData(); 
      } else {
        Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'รหัสผ่านไม่ถูกต้อง', showConfirmButton: false, timer: 3000 });
        document.getElementById('pinInput').value = '';
      }
    }
    document.getElementById('pinInput').addEventListener('keypress', e => { if (e.key === 'Enter') checkPin(); });

    function loadData() {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-teal-500 text-2xl"></i></td></tr>';
      document.getElementById('paginationControls').innerHTML = ''; // ล้างปุ่มแบ่งหน้าตอนโหลด
      
      fetch(SCRIPT_URL + "?action=getRequestsData")
        .then(res => res.json())
        .then(response => {
          if(!response.success) { Swal.fire('Error', response.message, 'error'); return; }
          
          requestsData = response.data; 
          currentPage = 1; // รีเซ็ตกลับไปหน้า 1 เสมอเมื่อโหลดข้อมูลใหม่
          
          updateSummary(); // เรียกฟังก์ชันคำนวณตัวเลขสรุป
          renderTablePage(); // เรียกฟังก์ชันวาดตารางตามหน้า
        }).catch(err => {
           Swal.fire('Error', 'โหลดข้อมูลไม่สำเร็จ', 'error');
        });
    }

    // ฟังก์ชันคำนวณตัวเลขใส่หน้าสรุป
    function updateSummary() {
      document.getElementById('count-total').innerText = requestsData.length;
      document.getElementById('count-pending').innerText = requestsData.filter(r => r.status === 'รอดำเนินการ').length;
      document.getElementById('count-progress').innerText = requestsData.filter(r => r.status === 'กำลังดำเนินการ').length;
      document.getElementById('count-done').innerText = requestsData.filter(r => r.status === 'ส่งไฟล์แล้ว').length;
    }

    // ฟังก์ชันวาดตารางแบบแบ่งหน้า
    function renderTablePage() {
      let html = '';
      if(requestsData.length === 0) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-500">ยังไม่มีข้อมูลคำขอ</td></tr>';
        document.getElementById('paginationControls').innerHTML = '';
        return;
      }

      // คำนวณช่วงข้อมูลที่จะแสดงในหน้านี้ (8 รายการ)
      const totalPages = Math.ceil(requestsData.length / rowsPerPage);
      const startIndex = (currentPage - 1) * rowsPerPage;
      const endIndex = startIndex + rowsPerPage;
      const displayData = requestsData.slice(startIndex, endIndex);

      // วนลูปสร้าง HTML เฉพาะข้อมูล displayData 
      displayData.forEach(item => {
        let badgeClass = item.status === 'รอดำเนินการ' ? 'bg-amber-100 text-amber-800' : 
                         item.status === 'ส่งไฟล์แล้ว' ? 'bg-green-100 text-green-800' : 
                         item.status === 'กำลังดำเนินการ' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800';
        
        let fileBtn = item.fileUrl && item.fileUrl !== "-" 
          ? `<a href="${item.fileUrl}" target="_blank" class="inline-flex items-center mt-1.5 px-2 py-1 bg-blue-50 text-blue-600 rounded text-[11px] hover:bg-blue-100 transition border border-blue-100"><i class="fa-solid fa-paperclip mr-1.5"></i> ดูไฟล์แนบ</a>`
          : `<div class="mt-1.5 text-[11px] text-gray-400">ไม่มีไฟล์แนบ</div>`;

        let typeBadge = item.dataType ? `<span class="bg-gray-100 text-gray-600 border border-gray-200 px-1.5 py-0.5 rounded text-[10px] ml-2 font-medium">${item.dataType}</span>` : '';
        let sqlIconClass = item.sql && item.sql.trim() !== "" ? "text-teal-600 border-teal-600 bg-teal-50" : "text-gray-400 border-gray-300 bg-white";
        let sqlBtn = `<button onclick="openSqlModal(${item.row})" class="hover:bg-teal-100 border ${sqlIconClass} px-3 py-2 rounded-lg text-xs font-medium shadow-sm transition ml-1" title="จัดการคำสั่ง SQL"><i class="fa-solid fa-code text-sm"></i></button>`;

        html += `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-5 py-4 text-gray-500 text-xs">${item.timestamp}</td>
            <td class="px-5 py-4">
              <p class="font-semibold text-gray-800">${item.name}</p>
              <p class="text-xs text-teal-600 mt-0.5">${item.dept}</p>
            </td>
            <td class="px-5 py-4 text-gray-700 whitespace-normal min-w-[200px]">
              <p class="font-medium">${item.reportName} ${typeBadge}</p>
              ${fileBtn}
            </td>
            <td class="px-5 py-4 text-center">
              <span id="status-badge-${item.row}" class="px-3 py-1 rounded-full text-[11px] font-bold tracking-wide ${badgeClass}">${item.status}</span>
            </td>
            <td class="px-5 py-4 text-center bg-gray-50/50">
              <div class="flex items-center justify-center space-x-1">
                <select id="status-select-${item.row}" class="border border-gray-300 rounded-lg text-xs p-2 bg-white focus:ring-teal-500 focus:border-teal-500 font-medium text-gray-700 outline-none">
                  <option value="รอดำเนินการ" ${item.status === 'รอดำเนินการ' ? 'selected' : ''}>⏳ รอดำเนินการ</option>
                  <option value="กำลังดำเนินการ" ${item.status === 'กำลังดำเนินการ' ? 'selected' : ''}>⚙️ กำลังดำเนินการ</option>
                  <option value="ส่งไฟล์แล้ว" ${item.status === 'ส่งไฟล์แล้ว' ? 'selected' : ''}>✅ ส่งไฟล์แล้ว</option>
                  <option value="ยกเลิก" ${item.status === 'ยกเลิก' ? 'selected' : ''}>❌ ยกเลิก</option>
                </select>
                <button onclick="saveStatus(${item.row})" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded-lg text-xs font-medium shadow-sm transition ml-1">บันทึก</button>
                ${sqlBtn}
              </div>
            </td>
          </tr>
        `;
      });
      document.getElementById('tableBody').innerHTML = html;

      // สร้างปุ่มแบ่งหน้า (Pagination)
      let paginationHtml = `
        <div class="flex justify-between items-center p-4 bg-gray-50 border-t border-gray-100">
          <button onclick="prevPage()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-50 shadow-sm transition" ${currentPage === 1 ? 'disabled' : ''}>
            <i class="fa-solid fa-chevron-left mr-1"></i> ก่อนหน้า
          </button>
          <span class="text-sm text-gray-600 font-medium">หน้า ${currentPage} / ${totalPages}</span>
          <button onclick="nextPage()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-50 shadow-sm transition" ${currentPage === totalPages ? 'disabled' : ''}>
            ถัดไป <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      `;
      document.getElementById('paginationControls').innerHTML = paginationHtml;
    }

    function prevPage() {
      if (currentPage > 1) { 
        currentPage--; 
        renderTablePage(); 
      }
    }
    
    function nextPage() {
      const totalPages = Math.ceil(requestsData.length / rowsPerPage);
      if (currentPage < totalPages) { 
        currentPage++; 
        renderTablePage(); 
      }
    }

    function saveStatus(row) {
      const selectObj = document.getElementById(`status-select-${row}`);
      const newStatus = selectObj.options[selectObj.selectedIndex].text.replace(/⏳ |⚙️ |✅ |❌ /g, '');
      
      if (newStatus === 'ยกเลิก') {
        Swal.fire({
          title: 'ระบุเหตุผลที่ยกเลิก',
          input: 'text', inputPlaceholder: 'เช่น ข้อมูลไม่ชัดเจน, ซ้ำซ้อน...', showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ปิด', confirmButtonColor: '#ef4444',
          inputValidator: (value) => { if (!value) return 'กรุณาระบุเหตุผลที่ยกเลิก!' }
        }).then((result) => { 
          if (result.isConfirmed) {
            executeSaveStatus(row, newStatus, result.value); 
          } else {
            renderTablePage(); // คืนค่ากลับไปหน้าตารางเดิมถ้ากดยกเลิก
          }
        });
      } else {
        executeSaveStatus(row, newStatus, ""); 
      }
    }

    function executeSaveStatus(row, newStatus, reason) {
      Swal.fire({ toast: true, position: 'top-end', title: 'กำลังบันทึก...', showConfirmButton: false, didOpen: () => Swal.showLoading() });
      
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateRequestStatus', payload: {row: row, status: newStatus, reason: reason} })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'อัปเดตสถานะเรียบร้อย', showConfirmButton: false, timer: 2000 });
          
          // อัปเดตข้อมูลในอาร์เรย์ (Array) ชั่วคราว
          const item = requestsData.find(r => r.row === row); 
          if(item) { 
            item.status = newStatus; 
            item.cancelReason = reason; 
          }
          // อัปเดตหน้าจอตัวเลขสรุปและตาราง
          updateSummary();
          renderTablePage();
        } else { Swal.fire('เกิดข้อผิดพลาด', res.message, 'error'); }
      }).catch(err => Swal.fire('Error', 'การเชื่อมต่อขัดข้อง', 'error'));
    }

    let sqlEditorInstance = null;

    function openSqlModal(row) {
      const item = requestsData.find(r => r.row === row);
      const currentSql = item.sql || "";

      Swal.fire({
        title: '<span class="text-xl font-bold text-gray-800"><i class="fa-solid fa-code text-teal-600 mr-2"></i> จัดการคำสั่ง SQL</span>',
        html: `
          <div class="flex justify-between items-end mb-3 mt-2"><div class="text-sm text-gray-700 font-medium text-left bg-gray-100 px-3 py-1.5 rounded-md border border-gray-200 w-3/4 truncate">เรื่อง: ${item.reportName}</div><button id="copySqlBtn" type="button" class="bg-teal-50 hover:bg-teal-100 text-teal-700 px-3 py-1.5 rounded-md text-xs font-semibold transition border border-teal-200 flex items-center shadow-sm"><i class="fa-regular fa-copy mr-1"></i> คัดลอก</button></div>
          <div class="border-2 border-gray-800 rounded-lg overflow-hidden shadow-inner bg-[#282a36]"><textarea id="sql-input">${currentSql}</textarea></div>
        `,
        showCancelButton: true, confirmButtonText: '<i class="fa-solid fa-save mr-1"></i> บันทึก', cancelButtonText: 'ปิด', confirmButtonColor: '#0d9488', width: '800px',
        didOpen: () => {
          sqlEditorInstance = CodeMirror.fromTextArea(document.getElementById('sql-input'), { mode: 'text/x-sql', theme: 'dracula', lineNumbers: true, lineWrapping: true });
          document.getElementById('copySqlBtn').addEventListener('click', () => {
            const code = sqlEditorInstance.getValue(); if(!code) return;
            navigator.clipboard.writeText(code).then(() => { const btn = document.getElementById('copySqlBtn'); btn.innerHTML = '<i class="fa-solid fa-check text-green-600 mr-1"></i> คัดลอกแล้ว'; setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> คัดลอก'; }, 2000); });
          });
        },
        preConfirm: () => { return sqlEditorInstance.getValue(); }
      }).then((result) => { if (result.isConfirmed) saveSql(row, result.value); });
    }

    function saveSql(row, sqlCommand) {
      Swal.fire({ toast: true, position: 'top-end', title: 'กำลังบันทึก SQL...', showConfirmButton: false, didOpen: () => Swal.showLoading() });
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateSqlCommand', payload: {row: row, sql: sqlCommand} })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'บันทึก SQL เรียบร้อย', showConfirmButton: false, timer: 2000 });
          const item = requestsData.find(r => r.row === row); if(item) item.sql = sqlCommand;
          renderTablePage(); // อัปเดตตารางเพื่อแสดงไอคอนสีเขียวทันที
        } else { Swal.fire('เกิดข้อผิดพลาด', res.message, 'error'); }
      }).catch(err => Swal.fire('Error', 'การเชื่อมต่อขัดข้อง', 'error'));
    }
  </script>
</body>
</html>
